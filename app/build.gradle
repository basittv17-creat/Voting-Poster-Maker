plugins {
    id 'com.android.application'
}

android {
    namespace 'com.awisogera.votingpostermaker'
    compileSdk 35

    defaultConfig {
        applicationId "com.awisogera.votingpostermaker"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ORG_GRADLE_PROJECT_SIGNING_STORE_FILE") ?: "missing-keystore.jks")
            storePassword System.getenv("ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("ORG_GRADLE_PROJECT_SIGNING_KEY_ALIAS")
            keyPassword System.getenv("ORG_GRADLE_PROJECT_SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
