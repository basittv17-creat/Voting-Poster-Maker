name: Android AAB Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          test -s "$RUNNER_TEMP/release-key.jks"

      - name: Build signed AAB
        env:
          KS_PATH: ${{ runner.temp }}/release-key.jks
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export ORG_GRADLE_PROJECT_SIGNING_STORE_FILE="$KS_PATH"
          export ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD="$KS_PASSWORD"
          export ORG_GRADLE_PROJECT_SIGNING_KEY_ALIAS="$KS_ALIAS"
          export ORG_GRADLE_PROJECT_SIGNING_KEY_PASSWORD="$KS_PASSWORD"
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-app-release-aab
          path: app/build/outputs/bundle/release/*.aab
