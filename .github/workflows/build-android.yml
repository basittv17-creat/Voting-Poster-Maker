name: Build Voting Poster Maker APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Configure release signing when GitHub secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/configure-signing.py

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect APK and AAB
        run: |
          mkdir -p release-files
          find android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} release-files/ \;
          find android/app/build/outputs/bundle -type f -name '*.aab' -exec cp {} release-files/ \;
          ls -lh release-files

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voting-poster-maker-android-builds
          path: release-files/*
          if-no-files-found: error
          retention-days: 30
