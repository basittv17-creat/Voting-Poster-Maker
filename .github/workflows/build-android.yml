name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Debug - List Files
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Android Files ==="
          ls -la android || echo "Android folder missing"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Decode Keystore
        run: |
          cd android/app
          echo "${{ secrets.STORE_FILE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Create gradle.properties
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> android/gradle.properties

      - name: Build Release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
