name: Build Android App

# The main branch retains the existing Capacitor workflow.
# On this Kotlin branch, the familiar manual build entry point invokes only native Android.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-release:
    if: github.ref == 'refs/heads/feature/native-kotlin-compose-rebuild'
    uses: ./.github/workflows/native-signed-candidate.yml
    secrets:
      STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
