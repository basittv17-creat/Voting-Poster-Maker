name: Android Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradle executable
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Run lint (strict)
        run: ./gradlew lint --warning-mode fail

      - name: Run tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK check
        run: ./gradlew assembleRelease
