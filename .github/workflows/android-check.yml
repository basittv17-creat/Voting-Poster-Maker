name: Android Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradle executable
        run: chmod +x gradlew

      - name: Clean project
        continue-on-error: true
        run: ./gradlew clean

      - name: Run lint
        continue-on-error: true
        run: ./gradlew lint --warning-mode all

      - name: Run tests
        continue-on-error: true
        run: ./gradlew test

      - name: Build debug APK
        continue-on-error: true
        run: ./gradlew assembleDebug

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          test -s "$RUNNER_TEMP/release-key.jks"

      - name: Build release APK
        continue-on-error: true
        env:
          KS_PATH: ${{ runner.temp }}/release-key.jks
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export ORG_GRADLE_PROJECT_SIGNING_STORE_FILE="$KS_PATH"
          export ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD="$KS_PASSWORD"
          export ORG_GRADLE_PROJECT_SIGNING_KEY_ALIAS="$KS_ALIAS"
          export ORG_GRADLE_PROJECT_SIGNING_KEY_PASSWORD="$KS_PASSWORD"
          ./gradlew assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/outputs/
