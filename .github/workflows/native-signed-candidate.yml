name: Native signed candidate

on:
  push:
    branches: [feature/native-kotlin-compose-rebuild]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-signed-candidate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/feature/native-kotlin-compose-rebuild'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed Android candidate
        env:
          STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/vpm-signing.XXXXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          export VPM_RELEASE_SIGNING_FILE="$signing_dir/signing.properties"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ("STORE_FILE_BASE64", "STORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
          for name in required:
              if not os.environ.get(name):
                  raise SystemExit(f"Missing repository signing secret: {name}")

          signing_path = Path(os.environ["VPM_RELEASE_SIGNING_FILE"])
          try:
              payload = base64.b64decode("".join(os.environ["STORE_FILE_BASE64"].split()), validate=True)
          except ValueError:
              raise SystemExit("Invalid base64 in STORE_FILE_BASE64") from None
          if not payload:
              raise SystemExit("Decoded signing file is empty")
          signing_path.with_name("release.jks").write_bytes(payload)

          def property_value(value):
              encoded = value.encode("utf-16-be")
              return "".join(chr(92) + "u" + encoded[i:i + 2].hex() for i in range(0, len(encoded), 2))

          aliases = {"storePassword": "STORE_PASSWORD", "keyAlias": "KEY_ALIAS", "keyPassword": "KEY_PASSWORD"}
          properties = ["storeFile=release.jks"]
          properties.extend(f"{key}={property_value(os.environ[name])}" for key, name in aliases.items())
          signing_path.write_text("\n".join(properties) + "\n", encoding="ascii")
          PY
          unset STORE_FILE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease
      - name: Verify signed outputs
        run: |
          set -euo pipefail
          export LC_ALL=C
          aab=app/build/outputs/bundle/release/app-release.aab
          apk=app/build/outputs/apk/release/app-release.apk
          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/vpm-aab-signature.txt"
          grep -Fxq 'jar verified.' "$RUNNER_TEMP/vpm-aab-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$aab" "$apk"
      - name: Check v9 upload certificate, package identity and 16 KB APK alignment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_dir="$RUNNER_TEMP/vpm-old-v9-aab"
          mkdir -p "$old_dir"
          gh run download 39577948457 --repo "$GITHUB_REPOSITORY" --name app-release-aab --dir "$old_dir"
          old_aab="$old_dir/app-release.aab"
          new_aab=app/build/outputs/bundle/release/app-release.aab
          new_apk=app/build/outputs/apk/release/app-release.apk
          test -s "$old_aab" && test -s "$new_aab" && test -s "$new_apk"
          old_fp=$(keytool -printcert -jarfile "$old_aab" | awk -F 'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d '\r')
          new_fp=$(keytool -printcert -jarfile "$new_aab" | awk -F 'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d '\r')
          test -n "$old_fp" && test -n "$new_fp"
          if [ "$old_fp" != "$new_fp" ]; then
            echo "::error::Historical v9 and Kotlin upload-signing certificates differ."
            exit 1
          fi
          echo "Historical v9/Kotlin upload certificate match: $new_fp"
          package_line=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$new_apk" | grep -m1 '^package:')
          if [[ "$package_line" != *"name='com.awisogera.votingpostermaker'"* ]]; then
            echo "::error::Unexpected Kotlin application ID."
            exit 1
          fi
          version_code=$(echo "$package_line" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          if ! [[ "$version_code" =~ ^[0-9]+$ ]] || [ "$version_code" -le 11 ]; then
            echo "::error::Kotlin version code must exceed the known main version 11."
            exit 1
          fi
          echo "Release candidate application ID verified; versionCode=$version_code"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$new_apk"
          echo "Release APK has 16 KB ZIP alignment for uncompressed native libraries."
          # This is upload-key compatibility, NOT Play App Signing, live Play policy approval
          # or evidence of an in-place update of the Play-distributed installation.
      - uses: actions/upload-artifact@v4
        with:
          name: voting-poster-maker-native-signed-candidate
          if-no-files-found: error
          path: |
            native-android/app/build/outputs/bundle/release/app-release.aab
            native-android/app/build/outputs/apk/release/app-release.apk
